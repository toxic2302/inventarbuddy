name: Java CI with Maven

on:
  push:
    branches: [ "main", "master", "stage" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
    contents: write
    packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: inventarbuddy
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Make mvnw executable
      run: chmod +x mvnw

    - name: Build and Test with Maven
      run: ./mvnw -B test
      env:
        # Disable Vault for tests in CI
        SPRING_CLOUD_VAULT_ENABLED: false
        # Database connection details (matching the postgres service)
        DATABASE_URL: jdbc:postgresql://localhost:5432/inventarbuddy
        DATABASE_USER: dev
        DATABASE_PASSWORD: pass
        # Additional settings to ensure tests run smoothly
        SPRING_DOCKER_COMPOSE_ENABLED: false

    - name: Generate JaCoCo Badge
      id: jacoco
      uses: cicirello/jacoco-badge-generator@v2
      with:
       generate-branches-badge: true
       jacoco-csv-file: target/site/jacoco/jacoco.csv
       badges-directory: .github/badges

    - name: Checkout badges branch
      run: |
           git fetch origin badges
           git worktree add /tmp/badges-branch badges

    - name: Copy badges into worktree
      run: |
           mkdir -p /tmp/badges-branch/.github/badges
           cp .github/badges/*.svg /tmp/badges-branch/.github/badges/

    - name: Log coverage percentage
      run: |
           echo "Coverage: ${{ steps.jacoco.outputs.coverage }}"
           echo "Branch coverage: ${{ steps.jacoco.outputs.branches }}"

    - name: Commit and push badges
      working-directory: /tmp/badges-branch
      run: |
           git config user.name "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"
           git add .github/badges/*.svg
           git diff --staged --quiet || git commit -m "Update coverage badges [skip ci]"
           git push origin badges

  # Baut und veroeffentlicht das Docker Image fuer den Self-Deploy (stage/prod).
  # Ein einziges Image wird gebaut; das aktive Spring-Profil wird erst zur
  # Laufzeit per SPRING_PROFILES_ACTIVE auf dem Server gesetzt.
  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Determine environment tag
      id: vars
      run: |
           if [ "${{ github.ref_name }}" = "stage" ]; then
             echo "tag=stage" >> "$GITHUB_OUTPUT"
           else
             echo "tag=prod" >> "$GITHUB_OUTPUT"
           fi

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deployt das zuvor gebaute Image per SSH auf den Zielserver.
  # Benoetigt die Repository-Secrets DEPLOY_HOST, DEPLOY_USER und DEPLOY_SSH_KEY.
  deploy:
    needs: docker
    if: github.event_name == 'push' && (github.ref_name == 'stage' || github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'stage' && 'stage' || 'prod' }}
    steps:
    - name: Determine environment tag
      id: vars
      run: |
           if [ "${{ github.ref_name }}" = "stage" ]; then
             echo "tag=stage" >> "$GITHUB_OUTPUT"
           else
             echo "tag=prod" >> "$GITHUB_OUTPUT"
           fi

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
             cd ${{ secrets.DEPLOY_PATH }}
             docker compose -f docker-compose.prod.yaml --env-file .env.${{ steps.vars.outputs.tag }} pull app
             docker compose -f docker-compose.prod.yaml --env-file .env.${{ steps.vars.outputs.tag }} up -d
